[package]
name = "multiway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sampled 2-9 player NLHE solving with side pots and tournament utility"

[features]
default = []
# Compiles the full-recall/sparse storage path. Production configs reject
# `recall = "full"` with MWP002, so no binary enables this; five of the
# crate's seven toy test games still run on that storage, because the dense
# arena requires a game whose public tree can be enumerated up front.
# Removing it means porting those toy games to the dense tree contract.
research-abstractions = []

[dependencies]
abstraction = { workspace = true }
cards = { workspace = true }
blake3 = { workspace = true }
postcard = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
toml = { workspace = true }




