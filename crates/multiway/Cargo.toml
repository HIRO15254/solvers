[package]
name = "multiway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sampled 2-9 player NLHE solving with side pots and tournament utility"

[features]
default = []
# Rollout/k-means and its solve-time assignment cache are retained only for
# reproducibility experiments. Production and ordinary workspace builds omit
# this feature; opt in explicitly for research binaries.
research-abstractions = []

[dependencies]
abstraction = { workspace = true }
cards = { workspace = true }
blake3 = { workspace = true }
postcard = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
toml = { workspace = true }

[[example]]
name = "rollout_sample_experiment"
required-features = ["research-abstractions"]

[[example]]
name = "abstraction_bucket_experiment"
required-features = ["research-abstractions"]

[[example]]
name = "abstraction_method_experiment"
required-features = ["research-abstractions"]

[[example]]
name = "abstraction_training_experiment"
required-features = ["research-abstractions"]
