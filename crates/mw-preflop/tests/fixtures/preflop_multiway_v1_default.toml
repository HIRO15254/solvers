schema = "solvers.nlh/v1"

[table]
players = 6

[table.stacks_bb]
BTN = 100.0
SB = 100.0
BB = 100.0
UTG = 100.0
HJ = 100.0
CO = 100.0

[economics]
kind = "cash"

[ranges]
BTN = "random"
SB = "random"
BB = "random"
UTG = "random"
HJ = "random"
CO = "random"

[tree]
script = '''
preflop when unopened { replace raise [2.5x, a] }
preflop when !unopened { replace raise [3x, a] }
flop when unopened { replace bet [50, a] }
flop when !unopened { replace raise [75, a] }
turn when unopened { replace bet [50, a] }
turn when !unopened { replace raise [75, a] }
river when unopened { replace bet [50, a] }
river when !unopened { replace raise [75, a] }
preflop when unopened { remove call }
preflop when unopened { replace raise [2.5x, a] }
preflop when limpers > 0 && aggressions == 0 { replace raise [2.5x, a] }
preflop when aggressions >= 1 { replace raise [3x, a] }
preflop when aggressions >= 4 { remove raise }
flop, turn, river when players >= 2 { checkdown }
'''
include_allin = true

[tree.max_aggressive_actions]
preflop = 4
flop = 3
turn = 3
river = 3

[solver]
kind = "range-vector"
seed = 0
opponent_exploration = 0.0
batch_sweeps = 1

[solver.discount]
kind = "periodic"
every_sweeps = 10000
until_sweeps = 10000000

[solver.pruning]
kind = "regret-based"

[solver.abstraction]
kind = "ehs2-percentile"

[solver.abstraction.buckets]
flop = 128
turn = 128
river = 128

[solver.stop]
target = 0.05
check_every_sweeps = 10000
confirmations = 3
evaluation_samples = 4096
deviator_traversals = 20000
max_sweeps = 5000000

[run]
threads = "auto"
memory = "auto"
checkpoint_interval = "15m"

[output]
probability_encoding = "u16"
