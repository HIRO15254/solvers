[package]
name = "hu-postflop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NLH HU postflop solving, terminal payoff pipeline, and compiled-tree toy games"

[dependencies]
anyhow = { workspace = true }
rayon = { workspace = true }
nlh = { workspace = true }
economics = { workspace = true }
spot = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
hu-engine = { workspace = true, features = ["serde"] }
runfiles = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
postcard = { workspace = true }
zstd = { workspace = true, features = ["zstdmt"] }
blake3 = { workspace = true }
tempfile = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
cfr-ref = { workspace = true }
criterion = { workspace = true }
# Integration tests, benches and examples see the test-support API; normal
# builds do not.
hu-postflop = { path = ".", features = ["test-support"] }
hu-engine = { workspace = true, features = ["serde", "test-support"] }

[features]
# Toy games, legacy models and artifact helpers used only by tests.
test-support = []

[[example]]
name = "p1_bench"
test = true

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "solve"
harness = false
