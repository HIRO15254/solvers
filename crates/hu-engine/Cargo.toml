[package]
name = "hu-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hot core: public game tree, regret/strategy storage, discount schedules, vector-form CFR, accelerated best response"

[dependencies]
nlh = { workspace = true }
rayon = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
# Integration tests and benches see the test-support API; normal builds do not.
hu-engine = { path = ".", features = ["test-support"] }

[features]
serde = ["dep:serde"]
# Query APIs used only by tests (not part of the product surface).
test-support = []

[[bench]]
name = "storage"
harness = false
