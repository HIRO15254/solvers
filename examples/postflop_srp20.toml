# Single-raised-pot flop, full 1,326-combo ranges, three streets, two raises
# per street. Release-scale: do not run this to completion in a debug build.
schema = "solvers.postflop/v1"

[game]
board = "Ks 7h 2d"
oop_range = "22+,A2s+,K9s+,Q9s+,J9s+,T8s+,97s+,87s,76s,A8o+,KTo+,QTo+,JTo"
ip_range = "22+,A2s+,K7s+,Q8s+,J8s+,T7s+,96s+,86s+,75s+,65s,54s,A5o+,K9o+,Q9o+,J9o+,T9o"
pot = 50
effective_stack = 200

[game.tree]
kind = "script"
script = '''
flop, turn, river {
  replace bet [100]
  replace raise [100]
}
'''

[algorithm]
schedule = "dcfr"

[run]
iterations = 1000
check_every = 25
target_nash_conv = 0.15
