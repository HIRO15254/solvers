# Six-max 2-BB throughput baseline with one aggressive action per street.
# Fixed solver settings are retained for structural and performance regression checks.
schema = "solvers.nlh/v1"

[table]
players = 6

[table.stacks_bb]
BTN = 2.0
SB = 2.0
BB = 2.0
UTG = 2.0
HJ = 2.0
CO = 2.0

[economics]
kind = "cash"

[ranges]
BTN = "random"
SB = "random"
BB = "random"
UTG = "random"
HJ = "random"
CO = "random"

[tree]
script = '''
preflop when unopened { replace raise [2.5x, a] }
preflop when !unopened { replace raise [3x, a] }
flop when unopened { replace bet [50, a] }
flop when !unopened { replace raise [75, a] }
turn when unopened { replace bet [50, a] }
turn when !unopened { replace raise [75, a] }
river when unopened { replace bet [50, a] }
river when !unopened { replace raise [75, a] }
preflop when unopened { remove call }
'''
include_allin = true

[tree.max_aggressive_actions]
preflop = 1
flop = 1
turn = 1
river = 1

[solver]
kind = "range-vector"
seed = 0
opponent_exploration = 0.0
batch_sweeps = 1

[solver.discount]
kind = "none"

[solver.pruning]
kind = "none"

[solver.abstraction]
kind = "ehs2-percentile"

[solver.abstraction.buckets]
flop = 2
turn = 2
river = 2

[solver.stop]
target = 1000000000000.0
check_every_sweeps = 4097
confirmations = 1
evaluation_samples = 256
deviator_traversals = 2000
max_sweeps = 4096

[run]
threads = 1
memory = "64MiB"
checkpoint_interval = "15m"

[output]
probability_encoding = "u16"
