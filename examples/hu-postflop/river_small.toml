# Small HU river with explicit ranges and a one-BB bet; suitable for a quick solve.
schema = "solvers.nlh/v1"

[table]
players = 2
stack_bb = 5

[spot]
line = "BTN r2.5, BB c / BB x, BTN x / BB x, BTN x"
board = "Ks 7h 2d 3c 9s"

[ranges]
BTN = "AhAd,QhQd"
BB = "JhJd,ThTd"

[tree]
script = '''river { replace bet [1bb] }
river when !unopened { replace raise [a] }'''

# Storage choices in [solver]: f32 (default), i16, i16-f32avg.
# DCFR defaults to pow4_reset = false; set true in [solver.algorithm] for resets.
[solver.stop]
max_iterations = 16
check_every = 4

[run]
threads = 1
