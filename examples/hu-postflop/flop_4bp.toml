# BTN 4-bet pot against the BB 3-bet: low stack-to-pot ratio, so the tree stays small.
# Flop sizes follow GTO Wizard's 4-bet pot trees; about 0.1 GiB of f32 storage.
schema = "solvers.nlh/v1"

[meta]
name = "6max NL50 BTN vs BB 4BP Ks7h2d"

[table]
players = 6
stack_bb = 100

[economics]
kind = "cash"

[economics.rake]
rate = 0.05
cap_bb = 4

[spot]
line = "BTN r2.5, BB r11, BTN r24, BB c"
board = "Ks 7h 2d"

[ranges]
BTN = "KK+,AKs,A5s-A4s,KQs,AKo"
BB = "QQ-TT,AKs-AQs,A5s,KQs,AKo"

[tree]
script = '''
flop {
  when donk { remove bet }
  replace bet [13, 38, 67, a]
  replace raise [a]
}
turn {
  replace bet [33, a]
  replace raise [a]
}
river {
  replace bet [a]
  when spr > 1.5 { add bet [33] }
  replace raise [a]
}
'''
allin_threshold = 0.67

[solver.stop]
target = "0.1%pot"
