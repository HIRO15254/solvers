# Historical research benchmark only.
# The production `solve` command rejects this legacy payload with MWP003.

[game]
kind = "preflop-multiway"
button = 3

[[game.seats]]
name = "UTG"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "HJ"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "CO"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "BTN"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "SB"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "BB"
stack_bb = 100.0
range = ""

[game.blinds]
small_bb = 0.5
big_bb = 1.0

[game.ante]
kind = "none"

[game.betting]
allow_limp = true

[game.betting.preflop]
bet_sizes = [{ kind = "to-bb", value = 2.5 }]
isolate_sizes = [{ kind = "to-bb", value = 4.0 }]
raise_sizes = [{ kind = "previous-bet-multiple", factor = 3.0 }]
max_aggressive_actions = 2
include_allin = false

[game.betting.flop]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.33 }, { kind = "pot-after-call", fraction = 0.75 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
max_aggressive_actions = 2
include_allin = false

[game.betting.turn]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.5 }, { kind = "pot-after-call", fraction = 1.0 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
max_aggressive_actions = 2
include_allin = false

[game.betting.river]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.5 }, { kind = "pot-after-call", fraction = 1.0 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
max_aggressive_actions = 2
include_allin = false

[game.abstraction]
flop_buckets = 64
turn_buckets = 64
river_buckets = 64
rollout_samples = 256
seed = 6464

[rake]
kind = "percent-cap"
rate = 0.05
cap = 3000.0
no_flop_no_drop = true

[utility]
kind = "chip-ev"

[algorithm]
schedule = "external-sampling-mccfr"
seed = 6464
exploration_epsilon = 0.06
discount_every = 100000
discount_until = 10000000

[run]
sweeps = 4
seed = 6464
check_every = 4
storage = "f32"
threads = 8
max_memory_bytes = 4294967296
checkpoint_every = 4
evaluation_samples = 16
evaluation_cadence = 4
