# Bridge compatibility smoke fixture.
#
# This intentionally uses the legacy internal payload accepted by `/v2`.
# The Bridge owns and sanitizes its cache/resource paths before execution.
# It is not a canonical v1 CLI config; direct release `solve` rejects it with
# MWP003. Actual EHS2 construction is reserved for ignored release tests.

[game]
kind = "preflop-multiway"
button = 0

[[game.seats]]
name = "BTN"
stack_bb = 2.0
range = ""

[[game.seats]]
name = "SB"
stack_bb = 2.0
range = ""

[[game.seats]]
name = "BB"
stack_bb = 2.0
range = ""

[game.blinds]
small_bb = 0.5
big_bb = 1.0

[game.ante]
kind = "none"

[game.betting]
allow_limp = false

[game.betting.preflop]
bet_sizes = []
raise_sizes = []
max_aggressive_actions = 1
include_allin = true

[game.betting.flop]
bet_sizes = []
raise_sizes = []
max_aggressive_actions = 1
include_allin = false

[game.betting.turn]
bet_sizes = []
raise_sizes = []
max_aggressive_actions = 1
include_allin = false

[game.betting.river]
bet_sizes = []
raise_sizes = []
max_aggressive_actions = 1
include_allin = false

[game.abstraction]
kind = "ehs2-table"
recall = "street"
flop_buckets = 2
turn_buckets = 2
river_buckets = 2

[rake]
kind = "none"

[utility]
kind = "chip-ev"

[algorithm]
schedule = "external-sampling-mccfr"
seed = 19
exploration_epsilon = 0.06
discount_every = 100000
discount_until = 10000000

[run]
sweeps = 2
seed = 19
check_every = 1
storage = "f32"
max_memory_bytes = 1073741824
checkpoint_every = 1
evaluation_samples = 8
evaluation_cadence = 1
