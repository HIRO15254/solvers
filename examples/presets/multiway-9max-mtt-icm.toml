# Multiway preflop configuration generated by Solvers
[game]
kind = "preflop-multiway"
button = 6

[[game.seats]]
name = "UTG"
stack_bb = 14.0
range = ""

[[game.seats]]
name = "UTG+1"
stack_bb = 16.0
range = ""

[[game.seats]]
name = "MP"
stack_bb = 18.0
range = ""

[[game.seats]]
name = "LJ"
stack_bb = 20.0
range = ""

[[game.seats]]
name = "HJ"
stack_bb = 22.0
range = ""

[[game.seats]]
name = "CO"
stack_bb = 24.0
range = ""

[[game.seats]]
name = "BTN"
stack_bb = 27.0
range = ""

[[game.seats]]
name = "SB"
stack_bb = 31.0
range = ""

[[game.seats]]
name = "BB"
stack_bb = 36.0
range = ""

[game.blinds]
small_bb = 0.5
big_bb = 1.0

[game.ante]
kind = "big-blind"
amount_bb = 1.0

[game.betting]
allow_limp = true

[game.betting.preflop]
bet_sizes = [{ kind = "to-bb", value = 2.5 }]
isolate_sizes = [{ kind = "to-bb", value = 3.5 }]
raise_sizes = [{ kind = "previous-bet-multiple", factor = 3.0 }, { kind = "previous-bet-multiple", factor = 2.5 }]
max_aggressive_actions = 2
include_allin = true

[game.betting.flop]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.5 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.5 }]
max_aggressive_actions = 2
include_allin = true

[game.betting.turn]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
max_aggressive_actions = 2
include_allin = true

[game.betting.river]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
max_aggressive_actions = 2
include_allin = true

# Full-table defaults, followed by budgets for each live-opponent count.
[game.abstraction]
flop_buckets = 64
turn_buckets = 64
river_buckets = 64
rollout_samples = 256
seed = 7

[[game.abstraction.active_opponent_buckets]]
active_opponents = 1
flop_buckets = 64
turn_buckets = 64
river_buckets = 64

[[game.abstraction.active_opponent_buckets]]
active_opponents = 2
flop_buckets = 64
turn_buckets = 64
river_buckets = 64

[[game.abstraction.active_opponent_buckets]]
active_opponents = 3
