# Bridge compatibility preset generated by Solvers.
# This is a legacy internal Bridge payload, not canonical v1 CLI input;
# direct release `solve` rejects it with MWP003.
[game]
kind = "preflop-multiway"
button = 3

[[game.seats]]
name = "UTG"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "HJ"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "CO"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "BTN"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "SB"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "BB"
stack_bb = 100.0
range = ""

[game.blinds]
small_bb = 0.5
big_bb = 1.0

[game.ante]
kind = "none"

[game.betting]
allow_limp = true

[game.betting.preflop]
bet_sizes = [{ kind = "to-bb", value = 2.5 }]
isolate_sizes = [{ kind = "to-bb", value = 3.5 }]
raise_sizes = [{ kind = "previous-bet-multiple", factor = 3.0 }, { kind = "previous-bet-multiple", factor = 2.5 }]
max_aggressive_actions = 2
include_allin = true

[game.betting.flop]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.5 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.5 }]
max_aggressive_actions = 2
include_allin = true

[game.betting.turn]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
max_aggressive_actions = 2
include_allin = true

[game.betting.river]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
max_aggressive_actions = 2
include_allin = true

# Release Bridge compatibility profile: fixed EHS2/current-street.
[game.abstraction]
kind = "ehs2-table"
recall = "street"
flop_buckets = 64
turn_buckets = 64
river_buckets = 64

[rake]
kind = "none"

[utility]
kind = "chip-ev"

[algorithm]
schedule = "external-sampling-mccfr"
seed = 7
exploration_epsilon = 0.06
discount_every = 100000
discount_until = 10000000

[run]
sweeps = 1000000
seed = 7
check_every = 50000
storage = "f32"
max_memory_bytes = 2147483648
evaluation_samples = 32
evaluation_cadence = 50000
checkpoint_every = 50000
