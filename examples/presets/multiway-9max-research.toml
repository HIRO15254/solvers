# Historical research preset generated by Solvers.
# It retains rollout/full-recall knobs for offline experiments and is not
# accepted by the production CLI or Bridge (MWP001/MWP003).
[game]
kind = "preflop-multiway"
button = 6

[[game.seats]]
name = "UTG"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "UTG+1"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "MP"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "LJ"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "HJ"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "CO"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "BTN"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "SB"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "BB"
stack_bb = 100.0
range = ""

[game.blinds]
small_bb = 0.5
big_bb = 1.0

[game.ante]
kind = "none"

[game.betting]
allow_limp = true

[game.betting.preflop]
bet_sizes = [{ kind = "to-bb", value = 2.0 }, { kind = "to-bb", value = 2.25 }, { kind = "to-bb", value = 2.5 }]
isolate_sizes = [{ kind = "to-bb", value = 3.5 }]
raise_sizes = [{ kind = "previous-bet-multiple", factor = 3.0 }, { kind = "previous-bet-multiple", factor = 2.5 }]
max_aggressive_actions = 3
include_allin = true

[game.betting.flop]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.33 }, { kind = "pot-after-call", fraction = 0.5 }, { kind = "pot-after-call", fraction = 0.75 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.5 }, { kind = "pot-after-call", fraction = 0.75 }, { kind = "pot-after-call", fraction = 1.25 }]
max_aggressive_actions = 3
include_allin = true

[game.betting.turn]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.5 }, { kind = "pot-after-call", fraction = 0.75 }, { kind = "pot-after-call", fraction = 1.25 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.75 }, { kind = "pot-after-call", fraction = 1.25 }]
max_aggressive_actions = 3
include_allin = true

[game.betting.river]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.5 }, { kind = "pot-after-call", fraction = 0.75 }, { kind = "pot-after-call", fraction = 1.5 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.75 }, { kind = "pot-after-call", fraction = 1.5 }]
max_aggressive_actions = 3
include_allin = true

# Full-table defaults, followed by budgets for each live-opponent count.
[game.abstraction]
flop_buckets = 200
turn_buckets = 200
river_buckets = 200
rollout_samples = 256
seed = 7

[[game.abstraction.active_opponent_buckets]]
active_opponents = 1
flop_buckets = 200
turn_buckets = 200
river_buckets = 200

[[game.abstraction.active_opponent_buckets]]
active_opponents = 2
flop_buckets = 200
turn_buckets = 200
river_buckets = 200

[[game.abstraction.active_opponent_buckets]]
active_opponents = 3
flop_buckets = 200
turn_buckets = 200
river_buckets = 200

[[game.abstraction.active_opponent_buckets]]
active_opponents = 4
flop_buckets = 200
turn_buckets = 200
river_buckets = 200

[[game.abstraction.active_opponent_buckets]]
active_opponents = 5
flop_buckets = 200
turn_buckets = 200
river_buckets = 200

[[game.abstraction.active_opponent_buckets]]
active_opponents = 6
flop_buckets = 200
turn_buckets = 200
river_buckets = 200

[[game.abstraction.active_opponent_buckets]]
active_opponents = 7
flop_buckets = 200
turn_buckets = 200
river_buckets = 200

[[game.abstraction.active_opponent_buckets]]
active_opponents = 8
flop_buckets = 200
turn_buckets = 200
river_buckets = 200

[rake]
kind = "none"

[utility]
kind = "chip-ev"

[algorithm]
schedule = "external-sampling-mccfr"
seed = 7
exploration_epsilon = 0.06
discount_every = 100000
discount_until = 10000000

[run]
sweeps = 5000000
seed = 7
check_every = 100000
storage = "f32"
max_memory_bytes = 2147483648
evaluation_samples = 32
evaluation_cadence = 100000
checkpoint_every = 100000
