# Three-max short-stack tree evaluated with tournament ICM and one bucket per street.
schema = "solvers.nlh/v1"

[table]
players = 3
stack_bb = 2

[economics]
kind = "tournament"
payouts = [100, 60, 0]

[tree]
script = '''preflop { replace raise [a] }
flop, turn, river { checkdown }'''

[tree.max_aggressive_actions]
preflop = 1

[solver.abstraction.buckets]
flop = 1
turn = 1
river = 1

[solver.stop]
max_sweeps = 2
check_every_sweeps = 3
evaluation_samples = 2
deviator_traversals = 1

[run]
threads = 1
memory = "64MiB"
