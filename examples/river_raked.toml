# Same river-only subgame as river_small.toml, with a 5% percent-cap rake
# applied to every terminal. Demonstrates that `[rake]`/`[utility]` sections
# apply to `kind = "postflop"` games exactly as they do to the toy games:
# expect ev_p0 + ev_p1 to land noticeably below zero once converged (see
# `raked_solve_leaks_exactly_the_rake_in_aggregate` in
# crates/holdem/tests/rake_icm.rs).
[game]
kind = "postflop"
board = "2c 7d 9h Js Qs"
oop_range = "22+,A2s+,KTo+"
ip_range = "55-22,QJs,A5s-A2s,KQo,T9s"
pot = 10
effective_stack = 50

[game.bets.river]
oop = [0.5]
ip = [0.5]
max_raises = 2

[rake]
kind = "percent-cap"
rate = 0.05
cap = 100.0
no_flop_no_drop = false

[run]
iterations = 200
check_every = 50
