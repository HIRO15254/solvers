# Migrated from ../3betpot_fast.toml: one old chip = one BB.
# HU table; pot/effective stack and per-street caps match the scaled fixture.
schema = "solvers.nlh/v1"

[table]
players = 2
stack_bb = 1000
ante_bb = 99

[economics]
kind = "cash"

[spot]
line = "BTN c, BB x"
board = "Qs Jh 2h"

[ranges]
BB = "TT+,AQs+,AQo+,A5s-A4s,KQs"
BTN = "JJ-22,AQs-A2s,KQs-KTs,QJs-QTs,JTs,T9s,98s,AQo-ATo,KQo"

[tree]
script = '''flop, turn, river {
  replace bet [75]
  replace raise [75]
}
'''
include_allin = false

[tree.max_aggressive_actions]
flop = 2
turn = 1
river = 1

[solver.algorithm]
schedule = "dcfr"

[solver.stop]
max_iterations = 1000
check_every = 100
target = "0.1bb"

[run]
threads = 6
