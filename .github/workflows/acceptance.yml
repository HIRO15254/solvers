name: Long-running acceptance

on:
  workflow_dispatch:
    inputs:
      skip:
        description: "Exact test name to skip (record the decision and issue with the evidence)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  # Portable builds on CI (override the local target-cpu=native default).
  RUSTFLAGS: "-D warnings"

jobs:
  release-ignored:
    name: Release tests (includes ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test release profile, including long-running ignored tests
        env:
          SKIP: ${{ inputs.skip }}
        run: |
          if [ -n "$SKIP" ]; then
            cargo test --workspace --release --no-fail-fast -- --include-ignored --skip "$SKIP" --exact
          else
            cargo test --workspace --release --no-fail-fast -- --include-ignored
          fi
