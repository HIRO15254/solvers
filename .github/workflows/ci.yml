name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Portable builds on CI (override the local target-cpu=native default).
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install UI dependencies
        working-directory: app/ui
        run: bun ci
      - name: Lint UI
        working-directory: app/ui
        run: bun run lint
      - name: Test UI
        working-directory: app/ui
        run: bun run test
      - name: Build UI
        working-directory: app/ui
        run: bun run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build desktop executable (release)
        run: cargo build --locked --release -p solvers-desktop --features custom-protocol
      - name: Test (debug)
        run: cargo test --workspace
