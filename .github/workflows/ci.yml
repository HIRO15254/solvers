name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Portable builds on CI (override the local target-cpu=native default).
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: app/ui
        run: pnpm install --frozen-lockfile
      - name: Lint UI
        working-directory: app/ui
        run: pnpm lint
      - name: Build UI
        working-directory: app/ui
        run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build desktop executable (release)
        run: cargo build --locked --release -p solvers-desktop --features custom-protocol
      - name: Test (debug)
        run: cargo test --workspace
      - name: Test (release, includes expensive count-pinning tests)
        run: cargo test --workspace --release -- --include-ignored
