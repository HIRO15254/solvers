[workspace]
resolver = "3"
members = [
    "crates/cards",
    "crates/hand-index",
    "crates/cfr-ref",
    "crates/engine",
    "crates/game",
    "crates/holdem",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hiro15254/solvers"

[workspace.dependencies]
cards = { path = "crates/cards" }
hand-index = { path = "crates/hand-index" }
cfr-ref = { path = "crates/cfr-ref" }
engine = { path = "crates/engine" }
game = { path = "crates/game" }
holdem = { path = "crates/holdem" }

# NOTE: aya_poker's "std" feature is broken in 0.1.0 (aya_base gates no_std on
# `cfg(std)` instead of `feature = "std"`), so we use the default no_std build.
aya_poker = "0.1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
