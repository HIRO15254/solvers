[workspace]
resolver = "3"
members = [
    "crates/nlh",
    "crates/economics",
    "crates/cfr-ref",
    "crates/hu-engine",
    "crates/hu-postflop",
    "crates/mw-preflop",
    "crates/runfiles",
    "crates/protocol",
    "crates/daemon",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hiro15254/solvers"

[workspace.dependencies]
nlh = { path = "crates/nlh" }
economics = { path = "crates/economics" }
cfr-ref = { path = "crates/cfr-ref" }
hu-engine = { path = "crates/hu-engine" }
hu-postflop = { path = "crates/hu-postflop" }
mw-preflop = { path = "crates/mw-preflop" }
runfiles = { path = "crates/runfiles" }
protocol = { path = "crates/protocol" }
daemon = { path = "crates/daemon" }

# NOTE: aya_poker's "std" feature is broken in 0.1.0 (aya_base gates no_std on
# `cfg(std)` instead of `feature = "std"`), so we use the default no_std build.
aya_poker = "0.1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
toml_edit = "0.22"
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
tempfile = "3"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
criterion = "0.5"
blake3 = "1"
postcard = { version = "1", features = ["alloc", "use-std"] }
zstd = "0.13"
rustc-hash = "2"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
