# Heads-up 20-BB benchmark B6 of docs/plans/p2-method-redesign.jp.md: preflop limps, opens and all-ins with
# postflop betting, for checking the L1 leaf model (abstracted heads-up postflop) on a small tree.
# The postflop menus are those of 6max_20bb.toml (benchmark B7): one bet of half the pot or all in per street.
schema = "solvers.nlh/v1"

[table]
players = 2

[table.stacks_bb]
BTN = 20.0
BB = 20.0

[economics]
kind = "cash"

[ranges]
BTN = "random"
BB = "random"

[tree]
script = '''
preflop when unopened { replace raise [2.5x, a] }
preflop when !unopened { replace raise [3x, a] }
preflop when aggressions >= 2 { replace raise [a] }
flop when unopened { replace bet [50, a] }
flop when !unopened { replace raise [75, a] }
turn when unopened { replace bet [50, a] }
turn when !unopened { replace raise [75, a] }
river when unopened { replace bet [50, a] }
river when !unopened { replace raise [75, a] }
'''
include_allin = true

[tree.max_aggressive_actions]
preflop = 3
flop = 1
turn = 1
river = 1

[solver]
kind = "range-vector"
seed = 0
opponent_exploration = 0.0
batch_sweeps = 1

[solver.discount]
kind = "none"

[solver.pruning]
kind = "none"

[solver.abstraction]
kind = "ehs2-percentile"

[solver.abstraction.buckets]
flop = 128
turn = 128
river = 128

[solver.stop]
target = 1000000.0
check_every_sweeps = 15000
confirmations = 1000000
evaluation_samples = 4096
deviator_traversals = 20000
max_sweeps = 30000

[run]
threads = 8
memory = "4GiB"
max_time = "15m"
checkpoint_interval = "5m"

[output]
probability_encoding = "u16"
