# TENTATIVE experimental default from the 2026-07-25 S3 seed-0 screening.
# This portable canonical v1 config does not change the generic solver default.
# Its game/tree contract matches candidate C-E256-street; no artifact_cache path
# is embedded.

schema = "solvers.multiway-preflop/v1"

[economics]
kind = "cash"

[economics.rake]
allocation = "main-first"
cap_bb = 4.0
rate = 0.05
rounding = "down"
rounding_unit_bb = 0.001
when = "flop_dealt"

[game]
button = 3
seat_count = 6

[game.abstraction]
kind = "ehs2-percentile"

[game.abstraction.buckets]
flop = 256
river = 256
turn = 256

[game.defaults]
range = "random"
stack_bb = 100.0

[game.information]
recall = "current-street"

[game.tree]
allow_limp = false
kind = "standard"

[game.tree.max_aggressive_actions]
flop = 4
preflop = 6
river = 4
turn = 4

[game.tree.reraise_jam_above_actor_starting_stack]
denominator = 3
numerator = 1

[[game.tree.rules]]
action = "raise"
effect = "replace"
priority = 100
sizes = ["2.5bb"]
street = "preflop"
when = "unopened"

[[game.tree.rules]]
action = "raise"
effect = "replace"
priority = 100
sizes = [
    "3x",
    "allin",
]
street = "preflop"
when = "aggressions >= 1 && in_position_to_last_aggressor"

[[game.tree.rules]]
action = "raise"
effect = "replace"
priority = 100
sizes = [
    "5x",
    "allin",
]
street = "preflop"
when = "aggressions >= 1 && !in_position_to_last_aggressor"

[[game.tree.rules]]
action = "bet"
effect = "replace"
priority = 100
sizes = [
    "50%pot",
    "allin",
]
street = "postflop"
when = "aggressions == 0"

[[game.tree.rules]]
action = "raise"
effect = "replace"
priority = 100
sizes = [
    "2.5x",
    "allin",
]
street = "postflop"
when = "aggressions >= 1"

[[game.tree.rules]]
action = "call"
effect = "remove"
priority = 200
street = "preflop"
when = 'aggressions == 1 && position != "BTN" && position != "SB" && position != "BB"'

[[game.tree.rules]]
action = "call"
effect = "remove"
priority = 200
street = "preflop"
when = "aggressions >= 2 && !preflop_participant"

[run]
max_sweeps = 10000

[run.checkpoint]
interval = "15m"

[run.resources]
memory = "6GiB"
threads = 6

[run.stop]
check_every_sweeps = 10000
confirmations = 1
deviator_traversals = 20000
evaluation_samples = 8192
target = 1000000.0

[solver]
batch_sweeps = 1
kind = "range-vector"
opponent_exploration = 0.0
seed = 1011

[solver.discount]
every_sweeps = 10000
kind = "periodic"
until_sweeps = 10000000

[solver.pruning]
kind = "none"
