# TENTATIVE experimental default from the 2026-07-25 S3 seed-0 screening.
# This portable canonical v1 config does not change the generic solver default.
# Its game/tree contract matches candidate T-E128-street; no artifact_cache path
# is embedded.

schema = "solvers.multiway-preflop/v1"

[economics]
kind = "tournament-icm"
payouts = [
    50.0,
    30.0,
    20.0,
]

[game]
button = 3
seat_count = 6

[game.abstraction]
kind = "ehs2-percentile"

[game.abstraction.buckets]
flop = 128
river = 128
turn = 128

[game.defaults]
range = "random"
stack_bb = 50.0

[game.information]
recall = "current-street"

[[game.players]]
ante_bb = 0.125
seat = 0

[[game.players]]
ante_bb = 0.125
seat = 1

[[game.players]]
ante_bb = 0.125
seat = 2

[[game.players]]
ante_bb = 0.125
seat = 3

[[game.players]]
ante_bb = 0.125
seat = 4

[[game.players]]
ante_bb = 0.125
seat = 5

[game.tree]
allow_limp = false
kind = "standard"

[game.tree.max_aggressive_actions]
flop = 4
preflop = 6
river = 4
turn = 4

[[game.tree.rules]]
action = "raise"
effect = "replace"
priority = 100
sizes = [
    "2bb",
    "allin",
]
street = "preflop"
when = "unopened"

[[game.tree.rules]]
action = "raise"
effect = "replace"
priority = 100
sizes = [
    "2.5x",
    "allin",
]
street = "preflop"
when = "aggressions == 1"

[[game.tree.rules]]
action = "raise"
effect = "replace"
priority = 100
sizes = [
    "2x",
    "allin",
]
street = "preflop"
when = "aggressions >= 2"

[[game.tree.rules]]
action = "bet"
effect = "replace"
priority = 100
sizes = [
    "50%pot",
    "allin",
]
street = "postflop"
when = "aggressions == 0"

[[game.tree.rules]]
action = "raise"
effect = "replace"
priority = 100
sizes = [
    "2.5x",
    "allin",
]
street = "postflop"
when = "aggressions >= 1"

[[game.tree.rules]]
action = "call"
effect = "remove"
priority = 200
street = "preflop"
when = 'aggressions == 1 && open_cold_calls >= 2 && position != "BB"'

[[game.tree.rules]]
action = "call"
effect = "remove"
priority = 200
street = "preflop"
when = "aggressions >= 2 && !preflop_participant"

[run]
max_sweeps = 10000

[run.checkpoint]
interval = "15m"

[run.resources]
memory = "6GiB"
threads = 6

[run.stop]
check_every_sweeps = 10000
confirmations = 1
deviator_traversals = 20000
evaluation_samples = 8192
target = 1000000.0

[solver]
batch_sweeps = 1
kind = "range-vector"
opponent_exploration = 0.0
seed = 1011

[solver.discount]
every_sweeps = 10000
kind = "periodic"
until_sweeps = 10000000

[solver.pruning]
kind = "none"
