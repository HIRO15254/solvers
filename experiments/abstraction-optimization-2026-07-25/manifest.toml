schema = "solvers.abstraction-optimization/v1"

# Selection is lexicographic:
# 1. pass the common-reference trained-deviation non-inferiority gate;
# 2. among non-inferior candidates, minimize warm wall time per sweep;
# 3. break ties within 5% by peak RSS, cold-build time, then model size.
[selection]
cash_noninferiority_bb = 0.01
tournament_noninferiority_prize_fraction = 0.00002
bootstrap_replicates = 10000
local_solver_memory_bytes = 6442450944
local_rss_stop_bytes = 8053063680 # 7.5 GiB

