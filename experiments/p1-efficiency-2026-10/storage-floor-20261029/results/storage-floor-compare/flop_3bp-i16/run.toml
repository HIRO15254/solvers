schema = "solvers.nlh/v1"

[meta]
name = "6max NL50 BB vs BTN 3BP Ks7h2d"

[table]
players = 6
stack_bb = 100
sb_bb = 0.5
ante_bb = 0
bb_ante_bb = 0
straddles_bb = []

[economics]
kind = "cash"

[economics.rake]
rate = 0.05
cap_bb = 4
when = "flop_dealt"
allocation = "main-first"
rounding = "down"
rounding_unit_bb = 0.001

[spot]
line = "BTN r2.5, BB r11, BTN c"
board = "Ks 7h 2d"

[ranges]
BTN = "JJ-55,AQs-A9s,A5s-A4s,KQs-KTs,QJs-QTs,JTs,T9s,98s,87s,76s,65s,AQo,KQo"
BB = "QQ+,AKs,AQs,A5s-A3s,KQs,K9s,QJs,76s,65s,AKo,AQo"

[tree]
script = '''
flop {
  replace bet [20, 56, 122]
  replace raise [50]
}
turn {
  replace bet [33, 75]
  replace raise [a]
}
river {
  replace bet [33, 75, a]
  replace raise [a]
}
flop, turn { when spr <= 1.5 { add bet [a] add raise [a] } }
flop when aggressions >= 3 { remove raise }
'''

[solver]
iso_merging = true
storage = "i16"
cfr_precision = "f32"

[solver.algorithm]
schedule = "dcfr"
alpha = 1.25
beta = 0.5
gamma = 4.0
pow4_reset = true

[solver.stop]
target = "0.1%pot"
max_iterations = 10000
check_every = 25

[solver.parallel]
chance_depth = 2
min_children = 12

[run]
threads = 8
memory = "auto"
max_time = "5m"
checkpoint_interval = "10h"
final_checkpoint = false

[output]
solution_streets = "full"
