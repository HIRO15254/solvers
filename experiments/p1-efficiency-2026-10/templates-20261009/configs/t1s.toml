schema = "solvers.nlh/v1"

[table]
players = 6
stack_bb = 100

[economics]
kind = "cash"

[economics.rake]
rate = 0.05
cap_bb = 4

[spot]
line = "BTN r2.5, BB c"
board = "Ks 7h 2d"

[ranges]
BTN = "22+,A2s+,K2s+,Q5s+,J7s+,T7s+,97s+,86s+,75s+,65s,54s,A5o+,K9o+,Q9o+,J9o+,T9o"
BB = "99-22,AJs-A2s,KJs-K2s,Q4s+,J6s+,T6s+,96s+,85s+,74s+,64s+,53s+,43s,AJo-A2o,K8o+,Q9o+,J9o+,T8o+,98o"
[tree]
script = '''
flop {
  when donk { remove bet }
  when cbet { replace bet [33, 125] }
  when unopened && !cbet && !donk { replace bet [33, 125] }
}
turn {
  replace bet [33, 100]
  when cbet { replace bet [33, 150] }
}
river {
  replace bet [50, 100, a]
}
flop, turn, river {
  replace raise [50]
  when spr <= 1.5 { add bet [a] add raise [a] }
}
river { add raise [a] }
'''
allin_threshold = 0.67

[tree.max_aggressive_actions]
flop = 3
turn = 3
river = 3

[solver.stop]
target = "0.1%pot"

[run]
final_checkpoint = false
