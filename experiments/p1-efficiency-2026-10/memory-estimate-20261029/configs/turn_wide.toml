# turn_srp.toml with more sizes: a larger one-chance-level tree for the
# memory-estimate thread calibration.
schema = "solvers.nlh/v1"

[table]
players = 6
stack_bb = 100

[economics]
kind = "cash"

[economics.rake]
rate = 0.05
cap_bb = 4

[spot]
line = "BTN r2.5, BB c / BB x, BTN x"
board = "Ks 7h 2d 3c"

[ranges]
BTN = "22+,A2s+,K2s+,Q5s+,J7s+,T7s+,97s+,86s+,75s+,65s,54s,A5o+,K9o+,Q9o+,J9o+,T9o"
BB = "99-22,AJs-A2s,KJs-K2s,Q4s+,J6s+,T6s+,96s+,85s+,74s+,64s+,53s+,43s,AJo-A2o,K8o+,Q9o+,J9o+,T8o+,98o"

[tree]
script = '''
turn {
  replace bet [33, 50, 75, 125, a]
  replace raise [50, a]
  when aggressions >= 3 { replace raise [a] }
}
river {
  replace bet [33, 66, 100, a]
  replace raise [50, a]
  when aggressions >= 3 { replace raise [a] }
}
'''

[solver.stop]
target = "0.1%pot"
