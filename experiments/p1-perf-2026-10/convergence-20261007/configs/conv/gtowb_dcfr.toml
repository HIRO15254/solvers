schema = "solvers.nlh/v1"

[table]
players = 6
stack_bb = 100

[economics]
kind = "cash"

[economics.rake]
rate = 0.05
cap_bb = 4

[spot]
line = "BTN r2.5, BB c"
board = "Ks 7h 2d"

[ranges]
BTN = "22+,A2s+,K2s+,Q5s+,J7s+,T7s+,97s+,86s+,75s+,65s,54s,A5o+,K9o+,Q9o+,J9o+,T9o"
BB = "99-22,AJs-A2s,KJs-K2s,Q4s+,J6s+,T6s+,96s+,85s+,74s+,64s+,53s+,43s,AJo-A2o,K8o+,Q9o+,J9o+,T8o+,98o"
[tree]
script = '''
flop when in_position { replace bet [33, 50, 75, 125] }
flop when !in_position { replace bet [33] }
turn, river { replace bet [50, 100] }
flop, turn, river when !unopened { replace raise [3x] }
'''
include_allin = true

[tree.max_aggressive_actions]
flop = 3
turn = 2
river = 2

[solver]
storage = "f32"

[solver.algorithm]
schedule = "dcfr"

[solver.stop]
max_iterations = 1500
check_every = 25

[run]
checkpoint_interval = "10h"
