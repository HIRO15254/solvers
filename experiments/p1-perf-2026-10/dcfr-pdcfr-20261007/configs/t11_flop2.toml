schema = "solvers.nlh/v1"

[table]
players = 6
stack_bb = 100

[economics]
kind = "cash"

[economics.rake]
rate = 0.05
cap_bb = 4

[spot]
line = "BTN r2.5, BB r11, BTN c"
board = "Jh Th 8c"

[ranges]
BTN = "JJ-55,AQs-A9s,A5s-A4s,KQs-KTs,QJs-QTs,JTs,T9s,98s,87s,76s,65s,AQo,KQo"
BB = "QQ+,AKs,AQs,A5s-A3s,KQs,K9s,QJs,76s,65s,AKo,AQo"

[tree]
script = '''
flop { replace bet [33, 75] }
turn, river { replace bet [66] }
flop, turn, river { replace raise [3x] }
'''

[tree.max_aggressive_actions]
flop = 2
turn = 2
river = 2

[solver]
storage = "f32"

[solver.algorithm]
schedule = "dcfr"

[solver.stop]
target = "0.1%pot"
max_iterations = 2000
check_every = 10

[run]
checkpoint_interval = "10h"
