# Historical research source of truth for the Tournament 6-max/50bb sparse
# feasibility benchmark. Production rejects its rollout/full-recall options
# with MWP001/MWP002. The compatibility config with the same game/tree contract is
# tournament-6max-50bb-one-size-postflop.toml; it exists only to name a warm
# rollout artifact until v1 exposes that cache path.

schema = "solvers.multiway-preflop/v1"

[game]
seat_count = 6
button = 3

[game.defaults]
stack_bb = 50.0
range = "random"

[[game.players]]
seat = 0
ante_bb = 0.125

[[game.players]]
seat = 1
ante_bb = 0.125

[[game.players]]
seat = 2
ante_bb = 0.125

[[game.players]]
seat = 3
ante_bb = 0.125

[[game.players]]
seat = 4
ante_bb = 0.125

[[game.players]]
seat = 5
ante_bb = 0.125

[game.tree]
kind = "standard"
allow_limp = false

[game.tree.max_aggressive_actions]
preflop = 6
flop = 4
turn = 4
river = 4

[[game.tree.rules]]
priority = 100
street = "preflop"
when = "unopened"
effect = "replace"
action = "raise"
sizes = ["2bb", "allin"]

[[game.tree.rules]]
priority = 100
street = "preflop"
when = "aggressions == 1"
effect = "replace"
action = "raise"
sizes = ["2.5x", "allin"]

[[game.tree.rules]]
priority = 100
street = "preflop"
when = "aggressions >= 2"
effect = "replace"
action = "raise"
sizes = ["2x", "allin"]

[[game.tree.rules]]
priority = 100
street = "postflop"
when = "aggressions == 0"
effect = "replace"
action = "bet"
sizes = ["50%pot", "allin"]

[[game.tree.rules]]
priority = 100
street = "postflop"
when = "aggressions >= 1"
effect = "replace"
action = "raise"
sizes = ["2.5x", "allin"]

[[game.tree.rules]]
priority = 200
street = "preflop"
when = "aggressions == 1 && open_cold_calls >= 2 && position != \"BB\""
effect = "remove"
action = "call"

[[game.tree.rules]]
priority = 200
street = "preflop"
when = "aggressions >= 2 && !preflop_participant"
effect = "remove"
action = "call"

[game.abstraction]
kind = "multiway-rollout"
rollouts_per_state = 512
seed = 0

[game.abstraction.buckets]
flop = 256
turn = 256
river = 256

[game.information]
recall = "bucket-history"

[economics]
kind = "tournament-icm"
payouts = [50.0, 30.0, 20.0]

[solver]
kind = "range-vector"
seed = 1011
opponent_exploration = 0.0
batch_sweeps = 1

[solver.discount]
kind = "periodic"
every_sweeps = 10000
until_sweeps = 10000000

[solver.pruning]
kind = "none"

[run]
max_sweeps = 100

[run.stop]
target = 1000000.0
check_every_sweeps = 100
confirmations = 1
evaluation_samples = 16
deviator_traversals = 1

[run.resources]
threads = 6
memory = "6GiB"

[run.checkpoint]
interval = "15m"
