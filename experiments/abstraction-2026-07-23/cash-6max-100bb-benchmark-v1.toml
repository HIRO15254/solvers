# Historical research source of truth for the Cash 6-max/100bb sparse
# feasibility benchmark. Production rejects its rollout/full-recall options
# with MWP001/MWP002. The compatibility config with the same game/tree contract is
# cash-6max-100bb-one-size-postflop.toml; it exists only to name a warm
# rollout artifact until v1 exposes that cache path.

schema = "solvers.multiway-preflop/v1"

[game]
seat_count = 6
button = 3

[game.defaults]
stack_bb = 100.0
range = "random"

[game.tree]
kind = "standard"
allow_limp = false
reraise_jam_above_actor_starting_stack = { numerator = 1, denominator = 3 }

[game.tree.max_aggressive_actions]
preflop = 6
flop = 4
turn = 4
river = 4

[[game.tree.rules]]
priority = 100
street = "preflop"
when = "unopened"
effect = "replace"
action = "raise"
sizes = ["2.5bb"]

[[game.tree.rules]]
priority = 100
street = "preflop"
when = "aggressions >= 1 && in_position_to_last_aggressor"
effect = "replace"
action = "raise"
sizes = ["3x", "allin"]

[[game.tree.rules]]
priority = 100
street = "preflop"
when = "aggressions >= 1 && !in_position_to_last_aggressor"
effect = "replace"
action = "raise"
sizes = ["5x", "allin"]

[[game.tree.rules]]
priority = 100
street = "postflop"
when = "aggressions == 0"
effect = "replace"
action = "bet"
sizes = ["50%pot", "allin"]

[[game.tree.rules]]
priority = 100
street = "postflop"
when = "aggressions >= 1"
effect = "replace"
action = "raise"
sizes = ["2.5x", "allin"]

[[game.tree.rules]]
priority = 200
street = "preflop"
when = "aggressions == 1 && position != \"BTN\" && position != \"SB\" && position != \"BB\""
effect = "remove"
action = "call"

[[game.tree.rules]]
priority = 200
street = "preflop"
when = "aggressions >= 2 && !preflop_participant"
effect = "remove"
action = "call"

[game.abstraction]
kind = "multiway-rollout"
rollouts_per_state = 2048
seed = 0

[game.abstraction.buckets]
flop = 256
turn = 256
river = 256

[game.information]
recall = "bucket-history"

[economics]
kind = "cash"

[economics.rake]
rate = 0.05
cap_bb = 4.0
when = "flop_dealt"
allocation = "main-first"
rounding_unit_bb = 0.001
rounding = "down"

[solver]
kind = "range-vector"
seed = 1011
opponent_exploration = 0.0
batch_sweeps = 1

[solver.discount]
kind = "periodic"
every_sweeps = 10000
until_sweeps = 10000000

[solver.pruning]
kind = "none"

[run]
max_sweeps = 100

[run.stop]
target = 1000000.0
check_every_sweeps = 100
confirmations = 1
evaluation_samples = 16
deviator_traversals = 1

[run.resources]
threads = 6
memory = "6GiB"

[run.checkpoint]
interval = "15m"
