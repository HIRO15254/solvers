# Pio-style flop tree exercising the whole tree-script surface: a `source`
# file (examples/trees/pio.tree) with `param`/`define`, nesting, `if`/`else`,
# and a board predicate; `[game.tree.params]` overriding one of its params;
# `[game.tree.max_aggressive_actions]` per street; tree-level `include_allin`
# / `allin_threshold`; `[game] preflop_aggressor`; and the generic condition
# rake plus tournament ICM against an outside field it already had. Small
# ranges keep it debug-runnable; the point is the tree grammar, not the spot.
schema = "solvers.postflop/v1"

[game]
board = "Qs Jh 2h"
oop_range = "TT+,AQs+,KQs"
ip_range = "JJ-99,AQs-ATs,KQs,QJs"
pot = 21
effective_stack = 195
min_bet = 1
preflop_aggressor = "ip"

[game.tree]
kind = "script"
source = "trees/pio.tree"
include_allin = true
allin_threshold = 0.8

[game.tree.max_aggressive_actions]
flop = 3
turn = 2
river = 2

[game.tree.params]
cb = 40

[rake]
kind = "generic"
rate = 0.05
cap = 6.0
when = "flop_dealt"
allocation = "main-first"
rounding = "down"
rounding_unit = 1.0

[utility]
kind = "tournament-icm"
payouts = [1000.0, 600.0, 400.0]
outside_field = [1800.0, 2600.0]

[algorithm]
schedule = "dcfr"

[run]
max_time = "2m"
check_every = 50
target_nash_conv = 0.05
