# Standard heads-up 100bb preflop: 2.5x open, 3x/2.5x reraises, up to 4
# raises with all-in offered at every level, limp allowed. Shares the same
# equity cache as the push/fold example (same 169x169 table regardless of
# stack depth or betting grammar).
schema = "solvers.preflop-hu/v1"

[game]
effective_stack_bb = 100.0
open_sizes_bb = [2.5]
raise_factors = [[3.0], [2.5]]
max_raises = 4
allow_limp = true

[algorithm]
schedule = "dcfr"

[run]
iterations = 5000
check_every = 250
