# GCP Spot convergence experiment anchor. The runner rewrites only the
# marked solver/run keys and keeps this game identical across variants.
schema = "solvers.multiway-preflop/v1"

[game]
seat_count = 6
button = 0
standard_blinds = true
preflop_first_to_act = "utg"
common_ante_bb = 0.0

[game.defaults]
stack_bb = 20.0
range = "random"

[game.tree]
kind = "standard"
allow_limp = false

[game.tree.max_aggressive_actions]
preflop = 3
flop = 1
turn = 1
river = 1

[[game.tree.rules]]
priority = 100
street = "preflop"
when = "unopened"
effect = "replace"
action = "raise"
sizes = ["2.5x", "a"]

[[game.tree.rules]]
priority = 110
street = "preflop"
when = "aggressions >= 1"
effect = "replace"
action = "raise"
sizes = ["3x", "a"]

[[game.tree.rules]]
priority = 120
street = "preflop"
when = "aggressions >= 3"
effect = "remove"
action = "raise"

[[game.tree.rules]]
priority = 200
street = "postflop"
when = "players >= 2"
effect = "checkdown"

[game.abstraction]
kind = "ehs2-percentile"

[game.abstraction.buckets]
flop = 32
turn = 32
river = 32

[game.information]
recall = "current-street"

[economics]
kind = "cash"

[solver]
kind = "range-vector"
seed = 0
opponent_exploration = 0.0
batch_sweeps = 1

[solver.discount]
kind = "none"

[solver.pruning]
kind = "none"

[run]
max_sweeps = 30000
max_time = "15m"

[run.stop]
# This high target is only paired with an unreachable confirmation count so
# stop checks run without ending training or adaptively doubling samples.
# It is not an accuracy target.
target = 1000000.0
check_every_sweeps = 15000
confirmations = 1000000
evaluation_samples = 4096
deviator_traversals = 20000

[run.resources]
threads = 8
memory = "48GiB"

[run.checkpoint]
interval = "5m"

[output]
probability_encoding = "u16"
