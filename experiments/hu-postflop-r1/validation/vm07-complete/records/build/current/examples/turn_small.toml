# Small turn subgame: tiny ranges, one bet size per street, single raise cap.
# Solves in seconds even in a debug build.
schema = "solvers.postflop/v1"

[game]
board = "2c 7d 9h Js"
oop_range = "AA,QQ,JJ,AKs"
ip_range = "KK,TT,AQs,KQs"
pot = 20
effective_stack = 80

[game.tree]
kind = "script"
script = '''
turn, river { replace bet [100] }
'''

[game.tree.max_aggressive_actions]
turn = 1
river = 1

[algorithm]
schedule = "dcfr"

[run]
iterations = 400
check_every = 100
