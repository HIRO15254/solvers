# Production-contract smoke fixture.
#
# Normal tests only run `solvers validate` against this file, so they verify
# the release EHS2/current-street contract without building the full EHS2
# tables. Tests that actually solve this fixture must remain explicit,
# ignored release-acceptance tests.

schema = "solvers.multiway-preflop/v1"

[game]
seat_count = 3
button = 0

[game.defaults]
stack_bb = 2.0
range = "random"

[game.tree]
kind = "standard"
allow_limp = false

[game.tree.max_aggressive_actions]
preflop = 1
flop = 1
turn = 1
river = 1

[game.abstraction]
kind = "ehs2-percentile"

[game.abstraction.buckets]
flop = 2
turn = 2
river = 2

[game.information]
recall = "current-street"

[economics]
kind = "cash"

[solver]
kind = "range-vector"
seed = 19
opponent_exploration = 0.0
batch_sweeps = 1

[solver.discount]
kind = "none"

[solver.pruning]
kind = "regret-based"

[run]
max_sweeps = 1

[run.stop]
target = 1000000.0
check_every_sweeps = 1
confirmations = 1
evaluation_samples = 8
deviator_traversals = 1

[run.resources]
threads = 1
memory = "auto"

[run.checkpoint]
interval = "15m"

[output]
probability_encoding = "u16"
