sizes = ["19bb", "a"]

[[game.tree.rules]]
priority = 150
street = "preflop"
when = "aggressions == 2 && limpers == 0 && players == 2 && position == \"SB\" && last_preflop_aggressor_position == \"BB\""
effect = "replace"
action = "raise"
sizes = ["21bb", "a"]

[[game.tree.rules]]
priority = 200
street = "postflop"
when = "players >= 2"
effect = "replace"
action = "bet"
sizes = ["50", "a"]

[[game.tree.rules]]
priority = 210
street = "postflop"
when = "players >= 2"
effect = "replace"
action = "raise"
sizes = ["2.5x", "a"]

[game.abstraction]
kind = "ehs2-percentile"

[game.abstraction.buckets]
flop = 256
turn = 256
river = 256

[game.information]
recall = "current-street"

[economics]
kind = "cash"

[economics.rake]
rate = 0.05
cap_bb = 4.0
# Working convention; application/rounding is not independently GTOW-verified.
when = "flop_dealt"
allocation = "main-first"
rounding_unit_bb = 0.001
rounding = "down"

[solver]
kind = "range-vector"
seed = 0
batch_sweeps = 4
opponent_exploration = 0.0

[solver.discount]
kind = "none"

[solver.pruning]
kind = "none"

[run]
max_sweeps = 4096
max_time = "2m"

[run.resources]
threads = 8
memory = "8GiB"

[run.stop]
# Schedule a final quality observation, without an early-stop accuracy claim.
target = 1000000.0
check_every_sweeps = 4096
confirmations = 1000000
evaluation_samples = 1024
deviator_traversals = 20000

[run.checkpoint]
interval = "5m"

[output]
probability_encoding = "u16"
