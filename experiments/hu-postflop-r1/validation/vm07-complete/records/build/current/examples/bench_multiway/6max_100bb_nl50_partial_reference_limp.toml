# Fixed 100bb fixture: spr > 1 distinguishes a normal raise from the 100bb jam.
# Preserve the legal call against a jam. Do not generalize this guard to other stacks.

[[game.tree.rules]]
priority = 140
street = "preflop"
when = "aggressions == 1 && limpers == 0 && flats == 0 && last_preflop_aggressor_position == \"UTG\" && position == \"HJ\" && spr > 1"
effect = "remove"
action = "call"

[[game.tree.rules]]
priority = 145
street = "preflop"
when = "aggressions == 2 && limpers == 0 && open_cold_calls == 0 && last_preflop_aggressor_position == \"HJ\" && spr > 1 && position in [\"CO\", \"BTN\", \"SB\", \"BB\"] && !preflop_participant"
effect = "remove"
action = "call"

[[game.tree.rules]]
priority = 146
street = "preflop"
