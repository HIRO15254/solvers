# Research screen: GTOW-observed opening and no-caller 3bet menus.
# The remaining preflop sizes and one-size postflop tree are approximations.
# This is not a complete GTO Wizard tree or an accuracy certificate.
schema = "solvers.multiway-preflop/v1"

[game]
seat_count = 6
button = 0
standard_blinds = true
preflop_first_to_act = "utg"

[game.defaults]
stack_bb = 100.0
range = "random"

[game.tree]
kind = "standard"
allow_limp = true
reraise_jam_above_actor_starting_stack = { numerator = 1, denominator = 3 }

[game.tree.max_aggressive_actions]
preflop = 4
flop = 4
turn = 4
river = 4


[[game.tree.rules]]
priority = 100
street = "preflop"
when = "unopened && position != \"SB\""
effect = "remove"
action = "call"

[[game.tree.rules]]
priority = 105
street = "preflop"
when = "limpers > 0 && aggressions == 0"
effect = "replace"
action = "raise"
sizes = ["3bb", "5bb", "a"]

[[game.tree.rules]]
priority = 110
street = "preflop"
when = "aggressions >= 1"
effect = "replace"
action = "raise"
sizes = ["2.5x", "a"]

# Fixed 100bb limp fixture: BB's 3bb and 5bb isos are distinguished by SPR.
# After SB limps, SPR is min(SB remaining, BB remaining) / pot: 97/4=24.25
# after 3bb and 95/6=15.833... after 5bb. The spr>1 guard excludes BB's jam.
[[game.tree.rules]]
priority = 115
street = "preflop"
when = "players == 2 && limpers > 0 && aggressions == 1 && position == \"SB\" && last_preflop_aggressor_position == \"BB\" && spr > 20"
effect = "replace"
action = "raise"
sizes = ["14bb", "a"]

[[game.tree.rules]]
priority = 116
street = "preflop"
when = "players == 2 && limpers > 0 && aggressions == 1 && position == \"SB\" && last_preflop_aggressor_position == \"BB\" && spr > 1 && spr <= 20"
effect = "replace"
action = "raise"
sizes = ["18bb", "a"]

# These SPR guards are exact only for this fixed 100bb fixture; changing
# stacks requires revalidating the boundaries and must not reuse them.

[[game.tree.rules]]
priority = 120
street = "preflop"
when = "unopened && limpers == 0 && position == \"UTG\""
effect = "replace"
action = "raise"
sizes = ["2bb", "a"]

[[game.tree.rules]]
priority = 120
street = "preflop"
when = "unopened && limpers == 0 && position == \"HJ\""
effect = "replace"
action = "raise"
sizes = ["2bb", "a"]

[[game.tree.rules]]
priority = 120
street = "preflop"
when = "unopened && limpers == 0 && position == \"CO\""
effect = "replace"
action = "raise"
sizes = ["2.3bb", "a"]

[[game.tree.rules]]
priority = 120
street = "preflop"
when = "unopened && limpers == 0 && position == \"BTN\""
effect = "replace"
action = "raise"
sizes = ["2.5bb", "a"]

[[game.tree.rules]]
