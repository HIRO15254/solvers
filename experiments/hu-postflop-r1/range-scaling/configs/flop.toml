# Scaling input derived from pipeline/configs/flop.toml; F32 fixed-iteration research only.
# Synthetic narrow-range fixture. Later streets check down, with all runouts.
schema = "solvers.postflop/v1"
[game]
board = "Ks 7h 2d"
oop_range = "AhAd,7c7d,QhQd"
ip_range = "AcAs,KhKd,JcJs"
pot = 20
effective_stack = 60
iso_merging = false
[game.tree]
kind = "script"
script = '''flop {
replace bet [50]
replace raise []
}
turn, river {
replace bet []
replace raise []
}'''
[game.tree.max_aggressive_actions]
flop = 1
turn = 1
river = 1
[algorithm]
schedule = "dcfr"
[run]
iterations = 50
check_every = 50
threads = 1
storage = "f32"
par_chance_depth = 2
par_min_children = 12
