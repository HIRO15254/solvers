[game.tree]
kind = "script"
include_allin = false
# Absolute street raise-to amounts; passive actions follow native tree rules.
script = '''
river {
  replace bet [200c, 450c, 900c, a]
  replace raise [a]
  when aggressions == 1 && to_call == 200 { replace raise [700c, 1050c, 1450c, a] }
  when aggressions == 1 && to_call == 450 { replace raise [1200c, 1750c, a] }
  when aggressions == 1 && to_call == 900 { replace raise [2100c, 2950c, a] }
  when aggressions == 2 && to_call == 500 { replace raise [1700c, 2400c, a] }
  when aggressions == 2 && to_call == 750 { replace raise [2700c, 3750c, a] }
  when aggressions == 2 && to_call == 850 { replace raise [2400c, 3350c, a] }
  when aggressions == 2 && to_call == 1200 { replace raise [4500c, 6200c, a] }
  when aggressions == 2 && to_call == 1250 { replace raise [3200c, 4450c, a] }
  when aggressions == 2 && to_call == 1300 { replace raise [3800c, 5250c, a] }
  when aggressions == 2 && to_call == 2050 { replace raise [6200c, a] }
  when aggressions == 3 && to_call == 1000 { replace raise [3700c, 5100c, a] }
  when aggressions == 3 && to_call == 1350 { replace raise [5100c, a] }
  when aggressions == 3 && to_call == 1500 { replace raise [5700c, a] }
  when aggressions == 3 && to_call == 1700 { replace raise [5100c, a] }
  when aggressions == 3 && to_call == 1750 { replace raise [6700c, a] }
}
'''

