# Synthetic pipeline fixture; all river runouts and one bet per street.
schema = "solvers.postflop/v1"
[game]
board = "2c 7d 9h Js"
oop_range = "AA,QQ,JJ,AKs"
ip_range = "KK,TT,AQs,KQs"
pot = 20
effective_stack = 60
iso_merging = false
[game.tree]
kind = "script"
script = '''turn, river {
replace bet [50]
replace raise []
}'''
[game.tree.max_aggressive_actions]
turn = 1
river = 1
[algorithm]
schedule = "dcfr"
[run]
iterations = 400
check_every = 25
target_nash_conv = 0.04
threads = 8
storage = "f32"
par_chance_depth = 2
par_min_children = 12
