schema = "solvers.postflop/v1"

[game]
board = "2c 7d 9h Js Qs"
oop_range = "22+,A2s+,KTo+"
ip_range = "55-22,QJs,A5s-A2s,KQo,T9s"
pot = 20
effective_stack = 60
min_bet = 1
iso_merging = false
preflop_aggressor = "none"

[game.tree]
kind = "script"
script = '''
river {
replace bet [50, 100]
replace raise [100]
}'''
include_allin = false

[game.tree.max_aggressive_actions]
flop = 2
turn = 2
river = 2

[game.tree.params]

[rake]
kind = "none"

[utility]
kind = "chip-ev"

[algorithm]
schedule = "dcfr"
alpha = 1.5
beta = 0.0
gamma = 3.0
pow4_reset = true

[run]
iterations = 100
check_every = 25
storage = "f32"
target_nash_conv = 0.04
threads = 8
par_chance_depth = 2
par_min_children = 12
