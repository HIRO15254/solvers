[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "solvers command-line interface"

[features]
default = []
# Opt-in command surface for reproducibility experiments. Production release
# builds intentionally omit it.
research = ["multiway/research-abstractions"]

[[bin]]
name = "solvers"
path = "src/main.rs"

[dependencies]
abstraction = { workspace = true }
cards = { workspace = true }
engine = { workspace = true, features = ["serde"] }
formats = { workspace = true }
game = { workspace = true }
holdem = { workspace = true }
preflop = { workspace = true }
multiway = { workspace = true, default-features = false }
anyhow = { workspace = true }
clap = { workspace = true }
rayon = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tiny_http = { workspace = true }

toml = { workspace = true }
toml_edit = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
# Unit/integration tests retain historical artifact and experiment coverage;
# this does not enable the feature in `cargo build --release --bin solvers`.
multiway = { workspace = true, features = ["research-abstractions"] }
