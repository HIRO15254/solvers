# Historical/research-only Multiway MCCFR throughput benchmark: legacy
# 6-max 100bb, rollout/full-recall, 64 buckets on every street. Production
# rejects this payload with MWP003; use tools/bench/mw_bench.sh with the
# isolated --features research binary. The rollout artifact is cached under
# target/ so repeated runs measure sweep throughput, not abstraction training.
[game]
kind = "preflop-multiway"
button = 3

[[game.seats]]
name = "UTG"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "HJ"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "CO"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "BTN"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "SB"
stack_bb = 100.0
range = ""

[[game.seats]]
name = "BB"
stack_bb = 100.0
range = ""

[game.blinds]
small_bb = 0.5
big_bb = 1.0

[game.ante]
kind = "none"

[game.betting]
allow_limp = true

[game.betting.preflop]
bet_sizes = [{ kind = "to-bb", value = 2.5 }]
isolate_sizes = [{ kind = "to-bb", value = 3.5 }]
raise_sizes = [{ kind = "previous-bet-multiple", factor = 3.0 }]
max_aggressive_actions = 3
include_allin = true

[game.betting.flop]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.5 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
max_aggressive_actions = 2
include_allin = true

[game.betting.turn]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
max_aggressive_actions = 2
include_allin = true

[game.betting.river]
bet_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
raise_sizes = [{ kind = "pot-after-call", fraction = 0.75 }]
max_aggressive_actions = 2
include_allin = true

[game.abstraction]
flop_buckets = 64
turn_buckets = 64
river_buckets = 64
rollout_samples = 256
seed = 7
artifact_cache = "target/mw-bench-cache/6max_64b.rollout"

[rake]
kind = "none"

[utility]
kind = "chip-ev"

[algorithm]
schedule = "external-sampling-mccfr"
seed = 7
exploration_epsilon = 0.06
discount_every = 100000
discount_until = 10000000

[run]
sweeps = 4096
seed = 7
check_every = 4096
storage = "f32"
threads = 8
max_memory_bytes = 4294967296
evaluation_samples = 8
evaluation_cadence = 4096
